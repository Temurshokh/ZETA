<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZETA | Parol Generator</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/xp.js" defer></script>
  <script src="../js/core/music.js" defer></script>
  <script src="../js/core/navigation.js" defer></script>
</head>

<body>
  <header>
    <div class="logo">
      <h2><a href="../tools.html" style="text-decoration: none; color: inherit"><i class="fas fa-arrow-left"></i>
          ZETA</a></h2>
    </div>
    <nav class="nav-links"></nav>
  </header>

  <main style="max-width: 420px">
    <section class="glass-panel">
      <h3 style="text-align: center; margin-bottom: 1rem;">🔐 Parol Generator</h3>
      <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; align-items: center;">
        <label style="font-size: 0.9rem;">Uzunlik: <span id="pass-len-val"
            style="font-weight: bold; color: var(--primary-accent)">12</span></label>
        <input type="range" id="pass-len" min="6" max="30" value="12"
          oninput="document.getElementById('pass-len-val').textContent = this.value" style="width: 55%" />
      </div>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem">
        <input type="text" id="pass-output" readonly
          style="flex: 1; padding: 0.75rem; border-radius: 10px; border: none; font-family: monospace; font-size: 1rem; background: rgba(0, 0, 0, 0.3); color: white;" />
        <button onclick="generatePass()" class="btn btn-sm"
          style="font-size: 1.2rem; padding: 0.5rem 0.75rem;">🔄</button>
      </div>
      <button onclick="copyPass()" class="btn btn-glass" style="width: 100%">Nusxalash</button>
    </section>
  </main>
  <script>
    function generatePass() {
      const length = document.getElementById("pass-len").value;
      const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
      let retVal = "";
      for (let i = 0; i < length; ++i) {
        retVal += charset.charAt(Math.floor(Math.random() * charset.length));
      }
      document.getElementById("pass-output").value = retVal;
      if (window.addXP) addXP(1);
    }
    function copyPass() {
      const val = document.getElementById("pass-output").value;
      if (val) {
        navigator.clipboard.writeText(val);
        alert("Parol nusxalandi!");
      }
    }
    generatePass();
  </script>
</body>

</html>
