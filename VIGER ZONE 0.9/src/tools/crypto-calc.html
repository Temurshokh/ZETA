<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZETA | Kripto Kalkulyator</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/xp.js" defer></script>
  <script src="../js/lang.js" defer></script>

  <script src="../js/core/music.js" defer></script>
  <script src="../js/core/navigation.js" defer></script>
</head>

<body>
  <header>
    <div class="logo">
      <h2>ZETA</h2>

    </div>
    <nav class="nav-links"></nav>
  </header>

  <main style="max-width: 500px; margin: 0 auto; padding: 20px;">
    <section class="text-center mb-4">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; background: rgba(0, 229, 255, 0.1); border-radius: 50%; margin-bottom: 1rem; border: 1px solid rgba(0, 229, 255, 0.3);">
        <i class="fas fa-exchange-alt" style="font-size: 1.5rem; color: var(--primary-accent);"></i>
      </div>
      <h1 style="font-size: 1.8rem; margin: 0; font-weight: 800; letter-spacing: -0.5px;">Kripto Kalkulyator</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Kripto va VAU qiymatlarini bir zumda hisoblang</p>
    </section>

    <section class="glass-panel" style="padding: 1.5rem;">
      <div style="display: flex; flex-direction: column; gap: 1.25rem">
        
        <!-- Amount Input -->
        <div class="input-group">
          <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Miqdor</label>
          <div style="position: relative;">
            <i class="fas fa-keyboard" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4);"></i>
            <input type="number" id="crypto-amount" value="1" min="0" step="any" placeholder="0.00" oninput="calculateCrypto()" style="
                  width: 100%;
                  padding: 1rem 1rem 1rem 2.8rem;
                  background: rgba(255, 255, 255, 0.03);
                  border: 1px solid var(--glass-border);
                  color: white;
                  border-radius: 12px;
                  font-size: 1.25rem;
                  font-weight: 600;
                  transition: all 0.3s;
                  outline: none;
                " onfocus="this.style.borderColor='var(--primary-accent)'; this.style.background='rgba(255,255,255,0.08)';" onblur="this.style.borderColor='var(--glass-border)'; this.style.background='rgba(255,255,255,0.03)';" />
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem; background: rgba(0,0,0,0.15); padding: 1.25rem; border-radius: 16px; border: 1px solid hsla(0,0%,100%,0.05);">
          <!-- From Currency -->
          <div>
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase;">O'tkazish (KriptoVau)</label>
            <div style="position: relative;">
              <select id="crypto-from" onchange="calculateCrypto()" style="
                    width: 100%;
                    padding: 1rem 1.2rem;
                    background: rgba(15, 23, 42, 0.9);
                    border: 1px solid var(--glass-border);
                    color: white;
                    border-radius: 12px;
                    font-size: 1.05rem;
                    cursor: pointer;
                    appearance: none;
                    font-weight: 600;
                    outline: none;
                    transition: border-color 0.3s;
                  " onfocus="this.style.borderColor='var(--primary-accent)';" onblur="this.style.borderColor='var(--glass-border)';">
                <option value="vau">💎 VAU (Virtual Aurum)</option>
                <option value="bitcoin">₿ Bitcoin (BTC)</option>
                <option value="ethereum">⟠ Ethereum (ETH)</option>
                <option value="the-open-network">💎 Toncoin (TON)</option>
                <option value="solana">◎ Solana (SOL)</option>
                <option value="binancecoin">🔶 BNB (BNB)</option>
                <option value="ripple">✕ XRP (XRP)</option>
                <option value="cardano">₳ Cardano (ADA)</option>
              </select>
              <i class="fas fa-chevron-down" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--primary-accent); pointer-events: none; font-size: 0.9rem;"></i>
            </div>
          </div>

          <div style="display: flex; justify-content: center; align-items: center; margin: -0.25rem 0;">
             <div style="background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 0.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; box-shadow: var(--shadow-sm);">
                <i class="fas fa-arrow-down" style="color: var(--text-muted); font-size: 0.9rem;"></i>
             </div>
          </div>

          <!-- To Currency -->
          <div>
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase;">Olish (Fiat)</label>
            <div style="position: relative;">
              <select id="crypto-to" onchange="calculateCrypto()" style="
                    width: 100%;
                    padding: 1rem 1.2rem;
                    background: rgba(15, 23, 42, 0.9);
                    border: 1px solid var(--glass-border);
                    color: white;
                    border-radius: 12px;
                    font-size: 1.05rem;
                    cursor: pointer;
                    appearance: none;
                    font-weight: 600;
                    outline: none;
                    transition: border-color 0.3s;
                  " onfocus="this.style.borderColor='var(--primary-accent)';" onblur="this.style.borderColor='var(--glass-border)';">
                <option value="usd">🇺🇸 USD - Dollar</option>
                <option value="eur">🇪🇺 EUR - Yevro</option>
                <option value="rub">🇷🇺 RUB - Rubl</option>
                <option value="uzs">🇺🇿 UZS - So'm</option>
              </select>
              <i class="fas fa-chevron-down" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--primary-accent); pointer-events: none; font-size: 0.9rem;"></i>
            </div>
          </div>
        </div>

        <!-- Result Card -->
        <div style="
              margin-top: 1rem;
              background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(0, 150, 255, 0.05));
              padding: 1.5rem;
              border-radius: 16px;
              text-align: center;
              border: 1px solid rgba(0, 229, 255, 0.2);
              position: relative;
              overflow: hidden;
            ">
          <div style="position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%); pointer-events: none;"></div>
          <span style="display: block; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">Umumiy Qiymat</span>
          <h2 id="calc-result" style="margin: 0; font-size: 2.2rem; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);">0.00</h2>
        </div>

      </div>
    </section>

    <div class="text-center mt-4 mb-4">
      <a href="../tools.html" class="btn btn-glass" style="padding: 0.75rem 2rem; border-radius: 30px;"><i class="fas fa-arrow-left"></i> Vositalarga Qaytish</a>
    </div>
  </main>

  <style>
    /* Prevent number input arrows */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
  </style>

  <script>
    let debounceTimer;

    function formatCurrency(value, currency) {
        if (isNaN(value) || value === 0) return `0.00 ${currency.toUpperCase()}`;
        
        let formatted = value.toLocaleString(undefined, { 
            minimumFractionDigits: currency === "uzs" ? 0 : 2,
            maximumFractionDigits: currency === "uzs" ? 0 : 2 
        });
        
        // Handle very small numbers specifically
        if (value > 0 && value < 0.01 && currency !== 'uzs') {
            formatted = value.toFixed(6);
        }
        
        return `${formatted} ${currency.toUpperCase()}`;
    }

    async function performCalculation() {
      const amount = document.getElementById("crypto-amount").value;
      const from = document.getElementById("crypto-from").value;
      const to = document.getElementById("crypto-to").value;
      const resultDisplay = document.getElementById("calc-result");

      if (!amount || isNaN(amount) || amount <= 0) {
        resultDisplay.textContent = formatCurrency(0, to);
        return;
      }

      resultDisplay.textContent = "...";

      // Handle Virtual Aurum locally (20,000 VAU = 1 USD -> 1 VAU = 0.00005 USD)
      if (from === 'vau') {
        handleFallback(amount, from, to, resultDisplay);
        return;
      }

      try {
        const url = `https://api.coingecko.com/api/v3/simple/price?ids=${from}&vs_currencies=${to}`;
        const response = await fetch(url);

        if (!response.ok) throw new Error("API Error");

        const data = await response.json();

        if (data[from] && data[from][to]) {
          const rate = data[from][to];
          const total = rate * parseFloat(amount);
          resultDisplay.textContent = formatCurrency(total, to);
        } else {
          throw new Error("Data not found");
        }
      } catch (error) {
        console.log("Using fallback rates due to API error/limit.");
        handleFallback(amount, from, to, resultDisplay);
      }
    }

    function handleFallback(amount, from, to, display) {
      const rates = {
        bitcoin: { usd: 87000 },
        ethereum: { usd: 3200 },
        "the-open-network": { usd: 5.5 },
        solana: { usd: 180 },
        binancecoin: { usd: 650 },
        ripple: { usd: 2.5 },
        cardano: { usd: 0.75 },
        vau: { usd: 0.00005 } // 20000 VAU = 1 USD
      };

      if (rates[from]) {
        let usdRate = rates[from].usd;
        let finalRate = usdRate;
        
        // Convert USD to target currency using approximate fallback rates
        if (to === "uzs") finalRate = usdRate * 12600;
        else if (to === "eur") finalRate = usdRate * 0.92;
        else if (to === "rub") finalRate = usdRate * 90;

        const total = finalRate * parseFloat(amount);
        display.innerHTML = `<span style="font-size: 0.6em; color: rgba(255,255,255,0.5);">~</span> ${formatCurrency(total, to)}`;
      } else {
        display.textContent = "Xatolik";
      }
    }

    function calculateCrypto() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(performCalculation, 400); // 400ms debounce
    }

    // Auto-calculate on load
    document.addEventListener("DOMContentLoaded", () => {
        performCalculation();
    });
  </script>
</body>

</html>
