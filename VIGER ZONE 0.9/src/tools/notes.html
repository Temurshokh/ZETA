<!doctype html>
<html lang="uz">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#00e5ff" />
    <title>Eslatma | ZETA</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="../js/core/state.js" defer></script>
    <script src="../js/core/telegram.js" defer></script>
    <script src="../js/xp.js" defer></script>
    <script src="../js/lang.js" defer></script>
    <style>
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .notes-app {
            flex: 1;
            padding: 1rem;
            padding-bottom: 80px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .notes-header h2 {
            margin: 0;
            font-size: 1.3rem;
        }

        .note-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--glass-bg);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .add-note-btn {
            width: 100%;
            padding: 14px;
            border: 2px dashed var(--glass-border);
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .add-note-btn:hover,
        .add-note-btn:active {
            border-color: var(--accent-brand);
            color: var(--accent-brand);
            background: rgba(0, 229, 255, 0.05);
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .note-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 14px;
            position: relative;
            transition: all 0.2s;
            animation: noteIn 0.3s ease-out;
        }

        @keyframes noteIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .note-card:active {
            transform: scale(0.98);
        }

        .note-title-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            margin-bottom: 6px;
            font-family: 'Inter', sans-serif;
        }

        .note-title-input::placeholder {
            color: var(--text-muted);
        }

        .note-body-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            outline: none;
            resize: none;
            min-height: 60px;
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
        }

        .note-body-input::placeholder {
            color: rgba(161, 161, 170, 0.5);
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--glass-border);
        }

        .note-date {
            font-size: 0.65rem;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .note-actions {
            display: flex;
            gap: 8px;
        }

        .note-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .note-action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .note-action-btn.delete:hover {
            color: var(--danger);
        }

        .note-color-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            border-radius: var(--radius-md) 0 0 var(--radius-md);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 1rem;
        }

        .empty-state p {
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            padding: 6px 0;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-brand);
        }

        @media (max-width: 480px) {
            .notes-app {
                padding: 0.75rem;
                padding-bottom: 80px;
            }

            .note-card {
                padding: 12px;
            }

            .note-title-input {
                font-size: 0.9rem;
            }

            .note-body-input {
                font-size: 0.8rem;
                min-height: 45px;
            }
        }
    </style>
  <script src="../js/core/music.js" defer></script>
  <script src="../js/core/navigation.js" defer></script>
</head>

<body>
    <div class="notes-app">
        <a href="../tools.html" class="back-link"><i class="fas fa-arrow-left"></i> Vositalar</a>

        <div class="notes-header">
            <h2><i class="fas fa-sticky-note" style="color: var(--accent-brand);"></i> Eslatma</h2>
            <span class="note-count" id="note-count">0</span>
        </div>

        <button class="add-note-btn" onclick="addNote()">
            <i class="fas fa-plus"></i> Yangi eslatma
        </button>

        <div class="notes-list" id="notes-list">
            <!-- Notes rendered here -->
        </div>

        <div class="empty-state" id="empty-state" style="display: none;">
            <i class="fas fa-sticky-note"></i>
            <p>Hali eslatmalar yo'q.<br>Yangi eslatma qo'shing!</p>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'zeta_notes';
        const COLORS = ['#00e5ff', '#7c4dff', '#fbbf24', '#10b981', '#f43f5e', '#8b5cf6'];

        function getNotes() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch { return []; }
        }

        function saveNotes(notes) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            updateCount();
        }

        function addNote() {
            const notes = getNotes();
            const note = {
                id: Date.now(),
                title: '',
                body: '',
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                created: new Date().toLocaleDateString('uz-UZ'),
                updated: new Date().toLocaleDateString('uz-UZ')
            };
            notes.unshift(note);
            saveNotes(notes);
            renderNotes();

            // Haptic feedback
            if (window.ZetaTelegram) ZetaTelegram.hapticImpact('light');

            // Focus on the new note's title
            setTimeout(() => {
                const firstTitle = document.querySelector('.note-title-input');
                if (firstTitle) firstTitle.focus();
            }, 100);
        }

        function deleteNote(id) {
            let notes = getNotes();
            notes = notes.filter(n => n.id !== id);
            saveNotes(notes);
            renderNotes();
            if (window.ZetaTelegram) ZetaTelegram.hapticImpact('medium');
        }

        function updateNote(id, field, value) {
            const notes = getNotes();
            const note = notes.find(n => n.id === id);
            if (note) {
                note[field] = value;
                note.updated = new Date().toLocaleDateString('uz-UZ');
                saveNotes(notes);
            }
        }

        function copyNote(id) {
            const notes = getNotes();
            const note = notes.find(n => n.id === id);
            if (note) {
                const text = (note.title ? note.title + '\n\n' : '') + note.body;
                navigator.clipboard.writeText(text).then(() => {
                    // Show quick feedback
                    if (window.ZetaTelegram) ZetaTelegram.hapticNotification('success');
                });
            }
        }

        function updateCount() {
            const notes = getNotes();
            const countEl = document.getElementById('note-count');
            if (countEl) countEl.textContent = notes.length;
        }

        function renderNotes() {
            const notes = getNotes();
            const list = document.getElementById('notes-list');
            const empty = document.getElementById('empty-state');

            if (notes.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = notes.map(note => `
        <div class="note-card" data-id="${note.id}">
          <div class="note-color-strip" style="background: ${note.color};"></div>
          <input class="note-title-input" type="text" placeholder="Sarlavha..."
            value="${escapeHTML(note.title)}"
            maxlength="100"
            oninput="updateNote(${note.id}, 'title', this.value)" />
          <textarea class="note-body-input" placeholder="Matn yozing..."
            maxlength="2000"
            oninput="autoResize(this); updateNote(${note.id}, 'body', this.value)">${escapeHTML(note.body)}</textarea>
          <div class="note-footer">
            <span class="note-date">${note.updated || note.created}</span>
            <div class="note-actions">
              <button class="note-action-btn" onclick="copyNote(${note.id})" title="Nusxalash">
                <i class="fas fa-copy"></i>
              </button>
              <button class="note-action-btn delete" onclick="deleteNote(${note.id})" title="O'chirish">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');

            // Auto-resize all textareas
            list.querySelectorAll('.note-body-input').forEach(autoResize);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Track tool usage
        if (window.logActivity) logActivity('tool', 'Eslatma');
        if (window.ZetaState) ZetaState.trackTool('Eslatma');

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderNotes();
            updateCount();
        });
    </script>
</body>

</html>
