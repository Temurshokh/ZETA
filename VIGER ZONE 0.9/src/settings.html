  <style>
    .bonus-badge {
      background: var(--success);
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      font-weight: 600;
    }

    .bonus-badge.claimed {
      background: var(--text-muted);
      text-decoration: line-through;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .setting-item:last-child {
      border-bottom: none;
    }

    .setting-label {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select {
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      outline: none;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: 0.4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.4s;
    }

    input:checked+.slider {
      background-color: var(--success);
    }

    input:checked+.slider:before {
      transform: translateX(26px);
    }

    .slider.round {
      border-radius: 24px;
    }

    .slider.round:before {
      border-radius: 50%;
    }

    /* Update History Styles */
    .update-history {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .version-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 15px;
      opacity: 0;
      transform: translateX(-20px);
      animation: slideInVersion 0.4s forwards;
    }

    .version-item.current {
      border-color: var(--primary-accent);
      background: rgba(59, 130, 246, 0.1);
    }

    @keyframes slideInVersion {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .version-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .version-tag {
      background: var(--primary-accent);
      color: white;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .version-tag.current {
      background: var(--success);
    }

    .version-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .version-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .version-changes {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .version-changes li {
      margin-bottom: 3px;
    }
  </style>

    function getLanguage() {
      const settings = JSON.parse(localStorage.getItem("zeta_settings") || '{}');
      return settings.lang || 'uz';
    }

    function renderUpdateHistory() {
      const container = document.getElementById('update-history');
      if (!container) return;

      const lang = getLanguage();
      const history = versionHistory[lang] || versionHistory.uz;

      container.innerHTML = history.map((v, i) => `
        <div class="version-item ${v.current ? 'current' : ''}" style="animation-delay: ${i * 0.1}s;">
          <div class="version-header">
            <span class="version-tag ${v.current ? 'current' : ''}">v${v.version}${v.current ? ' ✓' : ''}</span>
            <span class="version-date">${v.date}</span>
          </div>
          <div class="version-title">${v.title}</div>
          <ul class="version-changes">
            ${v.changes.map(c => `<li>${c}</li>`).join('')}
          </ul>
        </div>
      `).join('');
    }

    function claimHistoryBonus() {
      const claimed = localStorage.getItem('zeta_history_claimed');
      if (claimed) return;

      if (typeof addXP === 'function') {
        addXP(20);
      } else {
        let currentXP = parseInt(localStorage.getItem('zeta_xp') || '0');
        currentXP += 20;
        localStorage.setItem('zeta_xp', currentXP.toString());
      }

      localStorage.setItem('zeta_history_claimed', 'true');
      updateHistoryBadge();

      // Show animation
      const badge = document.getElementById('history-reward');
      if (badge) {
        badge.style.transform = 'scale(1.3)';
        setTimeout(() => {
          badge.style.transform = 'scale(1)';
        }, 200);
      }

      alert('+20 XP olindi! Yangilanish tarixini o\'qiganingiz uchun rahmat! 🎉');
    }

    function updateHistoryBadge() {
      const badge = document.getElementById('history-reward');
      const claimed = localStorage.getItem('zeta_history_claimed');
      if (badge && claimed) {
        badge.textContent = 'Olindi ✓';
        badge.classList.add('claimed');
        badge.style.cursor = 'default';
      }
    }

    function saveSettings() {
      const settings = {
        lang: document.getElementById("lang-select").value,
        sound: document.getElementById("sound-toggle").checked,
        notif: document.getElementById("notif-toggle").checked,
        musicTrack: document.getElementById("music-select").value,
        musicVolume: document.getElementById("music-volume").value,
      };
      localStorage.setItem("zeta_settings", JSON.stringify(settings));

      if (window.ZetaMusic) {
        ZetaMusic.setTrack(settings.musicTrack);
        ZetaMusic.setVolume(settings.musicVolume);
      }

      // Save crypto refresh rate
      const cryptoRefresh = document.getElementById("crypto-refresh").value;
      localStorage.setItem("zeta_crypto_refresh", cryptoRefresh);

      // Re-render history with new language
      renderUpdateHistory();

      if (settings.lang !== localStorage.getItem('_last_lang')) {
        localStorage.setItem('_last_lang', settings.lang);
        // Refresh to apply language changes
        location.reload();
      }
    }

    function loadSettings() {
      const data = localStorage.getItem("zeta_settings");
      if (data) {
        const settings = JSON.parse(data);
        document.getElementById("lang-select").value = settings.lang || "uz";
        document.getElementById("sound-toggle").checked = settings.sound !== false;
        document.getElementById("notif-toggle").checked = settings.notif !== false;
        document.getElementById("music-select").value = settings.musicTrack || "off";
        document.getElementById("music-volume").value = settings.musicVolume || 30;
      }

      const cryptoRefresh = localStorage.getItem("zeta_crypto_refresh");
      if (cryptoRefresh) {
        document.getElementById("crypto-refresh").value = cryptoRefresh;
      }
    }

    function resetData() {
      if (confirm("Barcha yig'ilgan XP va o'yin natijalari o'chiriladi. Aniqmi?")) {
        localStorage.clear();
        window.location.reload();
      }
    }

    function claimFounderBonus() {
      const claimed = localStorage.getItem('zeta_founder_bonus_claimed');
      if (!claimed) {
        if (typeof addXP === 'function') {
          addXP(100);
        } else {
          let currentXP = parseInt(localStorage.getItem('zeta_xp') || '0');
          currentXP += 100;
          localStorage.setItem('zeta_xp', currentXP.toString());
        }
        localStorage.setItem('zeta_founder_bonus_claimed', 'true');
        updateBonusBadge();
        alert('+100 XP olindi! ZETA kanalimizga xush kelibsiz! 🎉');
      }
    }

    function updateBonusBadge() {
      const badge = document.getElementById('bonus-badge');
      const claimed = localStorage.getItem('zeta_founder_bonus_claimed');
      if (badge && claimed) {
        badge.textContent = 'Olindi ✓';
        badge.classList.add('claimed');
      }
    }

    window.onload = function () {
      loadSettings();
      updateBonusBadge();
      updateHistoryBadge();
      renderUpdateHistory();

      // Render achievements
      if (typeof renderAchievementsSection === 'function') {
        renderAchievementsSection('achievements-container');
        const unlocked = typeof getUnlockedAchievements === 'function' ? getUnlockedAchievements() : [];
        const countEl = document.getElementById('achieve-count');
        if (countEl) countEl.textContent = `${unlocked.length}/9`;
      }
    };
  </script>
  <nav class="tab-bar"></nav>
</body>

</html>
