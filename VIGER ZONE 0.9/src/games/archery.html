<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archery 2D | VIGER ZONE</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/xp.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/game-ui.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/utils/Draggable.min.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/MorphSVGPlugin.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #222;
      overflow: hidden;
      font-family: sans-serif;
    }

    svg {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 100;
    }

    .hud-item {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 20px;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .instruction {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }
  </style>
  <script src="../js/core/music.js" defer></script>
  <script src="../js/core/navigation.js" defer></script>
</head>

<body class="game-page">
  <div id="ui-layer">
    <a href="../games.html" class="hud-item" style="text-decoration: none"><i class="fas fa-arrow-left"></i> Chiqish</a>
    <div class="hud-item">Score: <span id="score">0</span></div>
  </div>
  <div class="instruction">
    Kamondan o'q uzish uchun torting va qo'yib yuboring (Sichqoncha yoki
    Touch)
  </div>

  <svg id="game" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" overflow="visible">
    <linearGradient id="ArcGradient">
      <stop offset="0" stop-color="#fff" stop-opacity=".2" />
      <stop offset="50%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <path id="arc" fill="none" stroke="url(#ArcGradient)" stroke-width="4" d="M100,250c250-400,550-400,800,0"
      pointer-events="none" />
    <defs>
      <g id="arrow">
        <line x2="60" fill="none" stroke="#888" stroke-width="2" />
        <polygon fill="#888" points="64 0 58 2 56 0 58 -2" />
        <polygon fill="#88ce02" points="2 -3 -4 -3 -1 0 -4 3 2 3 5 0" />
      </g>
    </defs>
    <g id="target">
      <path fill="#FFF"
        d="M924.2,274.2c-21.5,21.5-45.9,19.9-52,3.2c-4.4-12.1,2.4-29.2,14.2-41c11.8-11.8,29-18.6,41-14.2 C944.1,228.3,945.7,252.8,924.2,274.2z" />
      <path fill="#F4531C"
        d="M915.8,265.8c-14.1,14.1-30.8,14.6-36,4.1c-4.1-8.3,0.5-21.3,9.7-30.5s22.2-13.8,30.5-9.7 C930.4,235,929.9,251.7,915.8,265.8z" />
      <path fill="#FFF"
        d="M908.9,258.9c-8,8-17.9,9.2-21.6,3.5c-3.2-4.9-0.5-13.4,5.6-19.5c6.1-6.1,14.6-8.8,19.5-5.6 C918.1,241,916.9,250.9,908.9,258.9z" />
      <path fill="#F4531C"
        d="M903.2,253.2c-2.9,2.9-6.7,3.6-8.3,1.7c-1.5-1.8-0.6-5.4,2-8c2.6-2.6,6.2-3.6,8-2 C906.8,246.5,906.1,250.2,903.2,253.2z" />
    </g>
    <g id="bow" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke" pointer-events="none">
      <polyline fill="none" stroke="#ddd" stroke-linecap="round" points="88,200 88,250 88,300" />
      <path fill="none" stroke="#88ce02" stroke-width="3" stroke-linecap="round"
        d="M88,300 c0-10.1,12-25.1,12-50s-12-39.9-12-50" />
    </g>
    <g class="arrow-angle">
      <use x="100" y="250" xlink:href="#arrow" />
    </g>
    <clipPath id="mask">
      <polygon opacity=".5" points="0,0 1500,0 1500,200 970,290 950,240 925,220 875,280 890,295 920,310 0,350"
        pointer-events="none" />
    </clipPath>
    <g class="arrows" clip-path="url(#mask)" pointer-events="none"></g>
    <g class="miss" fill="#aaa" opacity="0" transform="translate(0, 100)">
      <!-- Miss Text Path (Simplified) -->
      <text x="500" y="200" font-size="60" text-anchor="middle" fill="#aaa">
        MISS
      </text>
    </g>
    <g class="bullseye" fill="#F4531C" opacity="0">
      <text x="500" y="200" font-size="60" text-anchor="middle" fill="#F4531C">
        BULLSEYE!
      </text>
    </g>
    <g class="hit" fill="#ffcc00" opacity="0">
      <text x="500" y="200" font-size="60" text-anchor="middle" fill="#ffcc00">
        HIT!
      </text>
    </g>
  </svg>

  <script>
    var svg = document.querySelector("svg");
    var cursor = svg.createSVGPoint();
    var arrows = document.querySelector(".arrows");
    var randomAngle = 0;
    var score = 0;

    var target = { x: 900, y: 249.5 };
    var lineSegment = { x1: 875, y1: 280, x2: 925, y2: 220 };
    var pivot = { x: 100, y: 250 };

    window.addEventListener("mousedown", draw);
    window.addEventListener("touchstart", draw);

    function draw(e) {
      randomAngle = Math.random() * Math.PI * 0.03 - 0.015;
      TweenMax.to(".arrow-angle use", 0.3, { opacity: 1 });
      window.addEventListener("mousemove", aim);
      window.addEventListener("mouseup", loose);
      window.addEventListener("touchmove", aim);
      window.addEventListener("touchend", loose);
      aim(e);
    }

    function aim(e) {
      var point = getMouseSVG(e);
      point.x = Math.min(point.x, pivot.x - 7);
      point.y = Math.max(point.y, pivot.y + 7);
      var dx = point.x - pivot.x;
      var dy = point.y - pivot.y;
      var angle = Math.atan2(dy, dx) + randomAngle;
      var bowAngle = angle - Math.PI;
      var distance = Math.min(Math.sqrt(dx * dx + dy * dy), 50);
      var scale = Math.min(Math.max(distance / 30, 1), 2);

      TweenMax.to("#bow", 0.3, {
        scaleX: scale,
        rotation: bowAngle + "rad",
        transformOrigin: "right center",
      });
      TweenMax.to(".arrow-angle", 0.3, {
        rotation: bowAngle + "rad",
        svgOrigin: "100 250",
      });
      TweenMax.to(".arrow-angle use", 0.3, { x: -distance });
      TweenMax.to("#bow polyline", 0.3, {
        attr: {
          points:
            "88,200 " +
            Math.min(pivot.x - (1 / scale) * distance, 88) +
            ",250 88,300",
        },
      });

      var radius = distance * 9;
      var offset = {
        x: Math.cos(bowAngle) * radius,
        y: Math.sin(bowAngle) * radius,
      };
      var arcWidth = offset.x * 3;
      TweenMax.to("#arc", 0.3, {
        attr: {
          d:
            "M100,250c" +
            offset.x +
            "," +
            offset.y +
            "," +
            (arcWidth - offset.x) +
            "," +
            (offset.y + 50) +
            "," +
            arcWidth +
            ",50",
        },
        autoAlpha: distance / 60,
      });
    }

    function loose() {
      window.removeEventListener("mousemove", aim);
      window.removeEventListener("mouseup", loose);
      window.removeEventListener("touchmove", aim);
      window.removeEventListener("touchend", loose);

      TweenMax.to("#bow", 0.4, {
        scaleX: 1,
        transformOrigin: "right center",
        ease: Elastic.easeOut,
      });
      TweenMax.to("#bow polyline", 0.4, {
        attr: { points: "88,200 88,250 88,300" },
        ease: Elastic.easeOut,
      });

      var newArrow = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "use",
      );
      newArrow.setAttributeNS(
        "http://www.w3.org/1999/xlink",
        "href",
        "#arrow",
      );
      arrows.appendChild(newArrow);

      // Simple Bezier approximation for flight
      var path = [
        { x: 100, y: 250 },
        { x: 500, y: 100 },
        { x: 1200, y: 400 },
      ]; // Basic trajectory placeholder
      // MorphSVG is paid plugin, so we simulate simple physics or simple bezier
      // Since we can't use MorphSVGPlugin.pathDataToBezier without paid license usually, we used a dumbed down version in 'game.txt'
      // Or we just animate x/y. Let's try simple Tween to target direction.

      // Re-calculating end point based on aim
      // For this demo, let's keep it simple: Shoot straight-ish

      // Actually, let's use the code from game.txt logic but simplified without MorphSVG if possible,
      // OR assumes MorphSVG is available via CDN link provided (which is old, might work).
      // The provided link `https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/MorphSVGPlugin.min.js` usually works for Codepen demos.

      try {
        var pathData = document.getElementById("arc").getAttribute("d");
        var path = MorphSVGPlugin.pathDataToBezier(pathData); // This might fail if plugin not allowed

        TweenMax.to([newArrow], 0.5, {
          force3D: true,
          bezier: {
            type: "cubic",
            values: path,
            autoRotate: ["x", "y", "rotation"],
          },
          onUpdate: hitTest,
          onUpdateParams: ["{self}"],
          onComplete: onMiss,
          ease: Linear.easeNone,
        });
      } catch (e) {
        // Fallback if MorphSVG fails
        console.log("MorphSVG missing, linear shot");
        TweenMax.to([newArrow], 0.5, {
          x: 1000,
          y: 300,
          onUpdate: hitTest,
          onUpdateParams: ["{self}"],
          onComplete: onMiss,
        });
      }

      TweenMax.to("#arc", 0.3, { opacity: 0 });
      TweenMax.set(".arrow-angle use", { opacity: 0 });
    }

    function hitTest(tween) {
      var arrow = tween.target[0];
      var transform = arrow._gsTransform || {
        x: arrow.x.baseVal.value,
        y: arrow.y.baseVal.value,
        rotation: 0,
      }; // Fallback
      // GSAP 1.x/2.x stores transform on _gsTransform.
      // If using CSSPlugin, might be different.

      var x = transform.x;
      var y = transform.y;

      // Simple proximity check
      // Line Segment: (875, 280) to (925, 220)
      // Check distance to line segment

      if (x > 850 && x < 950 && y > 200 && y < 300) {
        var dist =
          Math.abs((925 - 875) * (280 - y) - (875 - x) * (220 - 280)) /
          Math.sqrt(Math.pow(925 - 875, 2) + Math.pow(220 - 280, 2));

        if (dist < 10) {
          tween.pause();
          var centerDist = Math.sqrt(
            Math.pow(x - target.x, 2) + Math.pow(y - target.y, 2),
          );
          if (centerDist < 10) {
            showMessage(".bullseye");
            score += 50;
            if (window.addXP) addXP(10);
          } else {
            showMessage(".hit");
            score += 10;
            if (window.addXP) addXP(2);
          }
          document.getElementById("score").innerText = score;
        }
      }
    }

    function onMiss() {
      showMessage(".miss");
    }

    function showMessage(selector) {
      TweenMax.killTweensOf(selector);
      TweenMax.set(selector, { autoAlpha: 1 });
      TweenMax.fromTo(
        selector,
        0.5,
        { scale: 0, rotation: -10 },
        { scale: 1, rotation: 0, ease: Back.easeOut },
      );
      TweenMax.to(selector, 0.3, { delay: 1, autoAlpha: 0 });
    }

    function getMouseSVG(e) {
      cursor.x = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
      cursor.y = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
      return cursor.matrixTransform(svg.getScreenCTM().inverse());
    }
  </script>
</body>

</html>
