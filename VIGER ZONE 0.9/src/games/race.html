<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Race 3D | ZETA</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/xp.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/game-ui.js" defer></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .hud-item {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 20px;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
    }

    /* Touch zones for screen halves */
    .touch-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      z-index: 9;
      touch-action: none;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }

    .touch-zone.active {
      background: rgba(0, 255, 255, 0.1);
    }

    #zone-left {
      left: 0;
    }

    #zone-right {
      right: 0;
    }

    .zone-arrow {
      font-size: 4rem;
      color: rgba(255, 255, 255, 0.05);
      pointer-events: none;
      transition: all 0.15s ease;
    }

    .touch-zone.active .zone-arrow {
      color: rgba(0, 255, 255, 0.3);
      transform: scale(1.2);
    }

    .controls-hint {
      position: absolute;
      bottom: 100px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8rem;
      pointer-events: none;
      z-index: 15;
    }

    /* Bottom control buttons (optional visual) */
    .controls-overlay {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
      z-index: 20;
    }

    .control-btn {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      pointer-events: auto;
      backdrop-filter: blur(5px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: all 0.1s ease;
    }

    .control-btn.active {
      transform: scale(0.9);
      background: rgba(0, 255, 255, 0.3);
      border-color: #00ffff;
    }
  </style>
  <script src="../js/core/music.js" defer></script>
  <script src="../js/core/navigation.js" defer></script>
</head>

<body class="game-page">
  <div id="ui-layer">
    <div class="hud-item">
      <a href="../games.html" style="color: white; text-decoration: none"><i class="fas fa-arrow-left"></i> Chiqish</a>
    </div>
    <div class="hud-item">Masofa: <span id="score">0</span>m</div>
  </div>

  <!-- Invisible touch zones for screen halves -->
  <div id="zone-left" class="touch-zone">
    <span class="zone-arrow">←</span>
  </div>
  <div id="zone-right" class="touch-zone">
    <span class="zone-arrow">→</span>
  </div>

  <div class="controls-hint">
    Chap/O'ng tomonga bosib turing
  </div>

  <div class="controls-overlay">
    <div class="control-btn" id="btn-left">
      <i class="fas fa-arrow-left"></i>
    </div>
    <div class="control-btn" id="btn-right">
      <i class="fas fa-arrow-right"></i>
    </div>
  </div>

  <div id="game-container"></div>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    // Scene Setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 10, 80);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      200,
    );
    camera.position.set(0, 3, 6);
    camera.lookAt(0, 0, -10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById("game-container").appendChild(renderer.domElement);

    // Environment
    const gridHelper = new THREE.GridHelper(200, 100, 0xff00ff, 0x222222);
    gridHelper.position.y = -1;
    scene.add(gridHelper);

    const roadGeo = new THREE.PlaneGeometry(16, 400);
    const roadMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -100;
    road.position.y = -1.01;
    scene.add(road);

    // Lights
    const light = new THREE.AmbientLight(0x404040);
    scene.add(light);
    const spotLight = new THREE.SpotLight(0xffffff, 1);
    spotLight.position.set(0, 20, 0);
    scene.add(spotLight);

    // Car
    const car = new THREE.Group();
    const chassis = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 0.5, 2.5),
      new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        roughness: 0.2,
        metalness: 0.8,
      }),
    );
    chassis.position.y = 0.5;
    car.add(chassis);
    scene.add(car);

    // Obstacles
    const obstacles = [];
    const obsGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const obsMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });

    // Game State
    let speed = 0.5;
    let score = 0;
    let gameOver = false;
    let turnInput = 0;
    let spawnTimer = 0;
    let animationId;

    function resetGame() {
      gameOver = false;
      speed = 0.5;
      score = 0;
      car.position.x = 0;
      turnInput = 0;
      document.getElementById("score").innerText = 0;
      obstacles.forEach((o) => scene.remove(o));
      obstacles.length = 0;

      // Reset UI
      document.querySelectorAll('.touch-zone, .control-btn').forEach(el => {
        el.classList.remove('active');
      });

      animate();
    }

    // Control functions
    function startTurn(dir) {
      turnInput = dir;
    }

    function stopTurn() {
      turnInput = 0;
    }

    // Touch Zone setup - HOLD to steer
    const zoneLeft = document.getElementById('zone-left');
    const zoneRight = document.getElementById('zone-right');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    function setupTouchControl(zone, btn, direction) {
      const start = (e) => {
        e.preventDefault();
        startTurn(direction);
        zone.classList.add('active');
        btn.classList.add('active');
      };

      const end = () => {
        if (turnInput === direction) {
          stopTurn();
        }
        zone.classList.remove('active');
        btn.classList.remove('active');
      };

      // Zone events
      zone.addEventListener('touchstart', start, { passive: false });
      zone.addEventListener('touchend', end);
      zone.addEventListener('touchcancel', end);
      zone.addEventListener('mousedown', start);
      zone.addEventListener('mouseup', end);
      zone.addEventListener('mouseleave', end);

      // Button events
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end);
      btn.addEventListener('touchcancel', end);
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    setupTouchControl(zoneLeft, btnLeft, -1);
    setupTouchControl(zoneRight, btnRight, 1);

    // Keyboard controls
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") {
        startTurn(-1);
        btnLeft.classList.add('active');
      }
      if (e.key === "ArrowRight") {
        startTurn(1);
        btnRight.classList.add('active');
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" && turnInput === -1) {
        stopTurn();
        btnLeft.classList.remove('active');
      }
      if (e.key === "ArrowRight" && turnInput === 1) {
        stopTurn();
        btnRight.classList.remove('active');
      }
    });

    // Game loop
    function animate() {
      if (gameOver) return;
      animationId = requestAnimationFrame(animate);

      // Car movement - continuous while holding
      car.position.x += turnInput * 0.2;

      // Clamp road width
      if (car.position.x > 7) car.position.x = 7;
      if (car.position.x < -7) car.position.x = -7;

      // Bank effect
      car.rotation.z = -turnInput * 0.1;
      car.rotation.y = -turnInput * 0.1;

      // Move Grid (Illusion)
      gridHelper.position.z += speed;
      if (gridHelper.position.z > 2) gridHelper.position.z = 0;

      // Spawn Obstacles
      spawnTimer++;
      if (spawnTimer > 60) {
        spawnTimer = 0;
        const obs = new THREE.Mesh(obsGeo, obsMat);
        obs.position.z = -100;
        obs.position.x = Math.random() * 12 - 6;
        obs.position.y = 0;
        scene.add(obs);
        obstacles.push(obs);
      }

      // Update Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.position.z += speed;

        // Collision
        const dx = o.position.x - car.position.x;
        const dz = o.position.z - car.position.z;

        if (Math.abs(dz) < 2 && Math.abs(dx) < 1.3) {
          gameOver = true;
          cancelAnimationFrame(animationId);

          if (window.addXP) addXP(Math.floor(score / 5));

          if (window.GameUI) {
            window.GameUI.showGameOver(Math.floor(score), resetGame);
          } else {
            alert("Game Over! Score: " + Math.floor(score));
            resetGame();
          }
          return;
        }

        if (o.position.z > 10) {
          scene.remove(o);
          obstacles.splice(i, 1);
        }
      }

      // Score with distance
      score += speed;
      document.getElementById("score").innerText = Math.floor(score);

      // Speed up gradually
      speed += 0.0005;

      renderer.render(scene, camera);
    }

    animate();

    // Resize handler
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
