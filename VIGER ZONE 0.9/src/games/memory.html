<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Xotira O'yini | VIGER ZONE</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/xp.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/core/music.js" defer></script>
  <script src="../js/core/navigation.js" defer></script>
</head>

<body class="game-page">
  <header>
    <div class="logo">
      <h2>
        <a href="../games.html" style="text-decoration: none; color: inherit">&larr; VIGER ZONE</a>
      </h2>
    </div>
    <div id="xp-display"></div>
  </header>

  <main class="text-center">
    <h2 class="mb-4">Xotira Mashqi</h2>
    <div id="game-info" style="margin-bottom: 1rem">
      Urinishlar: <span id="moves">0</span>
    </div>
    <div id="memory-grid" class="grid-4"></div>
    <button onclick="initGame()" class="btn mt-4">Qayta Boshlash</button>
  </main>

  <style>
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 70px);
      gap: 8px;
      justify-content: center;
    }

    .card {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      transition:
        transform 0.3s,
        background 0.3s;
    }

    .card.flipped {
      background: var(--glass-highlight);
      transform: rotateY(180deg);
    }

    .card.matched {
      background: var(--success);
      opacity: 0.5;
      cursor: default;
    }
  </style>

  <script>
    const emojis = [
      "🍕",
      "🍕",
      "🚀",
      "🚀",
      "🐱",
      "🐱",
      "🌵",
      "🌵",
      "💎",
      "💎",
      "🎈",
      "🎈",
      "🎸",
      "🎸",
      "🔑",
      "🔑",
    ];
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;

    function initGame() {
      const grid = document.getElementById("memory-grid");
      grid.innerHTML = "";
      cards = [...emojis].sort(() => 0.5 - Math.random());
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      document.getElementById("moves").textContent = moves;

      cards.forEach((emoji, index) => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.index = index;
        card.onclick = () => flipCard(card, emoji);
        grid.appendChild(card);
      });
    }

    function flipCard(card, emoji) {
      if (
        flippedCards.length < 2 &&
        !card.classList.contains("flipped") &&
        !card.classList.contains("matched")
      ) {
        card.classList.add("flipped");
        card.textContent = emoji;
        flippedCards.push({ card, emoji });

        if (flippedCards.length === 2) {
          moves++;
          document.getElementById("moves").textContent = moves;
          setTimeout(checkMatch, 1000);
        }
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      if (c1.emoji === c2.emoji) {
        c1.card.classList.add("matched");
        c2.card.classList.add("matched");
        matchedPairs++;
        if (window.addXP) addXP(5); // XP for match

        if (matchedPairs === emojis.length / 2) {
          setTimeout(() => {
            alert(`G'alaba! Siz ${moves} ta urinishda topdingiz.`);
            if (window.addXP) addXP(50); // XP for win
          }, 500);
        }
      } else {
        c1.card.classList.remove("flipped");
        c2.card.classList.remove("flipped");
        c1.card.textContent = "";
        c2.card.textContent = "";
      }
      flippedCards = [];
    }

    initGame();
  </script>
</body>

</html>
