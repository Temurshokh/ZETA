<!doctype html>
<html lang="uz">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Flappy Jump | ZETA</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="../js/xp.js" defer></script>
    <script src="../js/main.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            touch-action: manipulation;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .game-header a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #score-display {
            color: #fbbf24;
            font-weight: 700;
            font-size: 1rem;
        }

        #game-canvas {
            flex: 1;
            display: block;
            width: 100%;
            cursor: pointer;
        }

        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        .game-overlay h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fbbf24, #f97316);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-overlay .score-big {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            margin: 0.5rem 0;
        }

        .game-overlay .highscore {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1.5rem;
        }

        .game-overlay button {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border: none;
            color: white;
            padding: 14px 40px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin: 6px;
            min-width: 200px;
            transition: transform 0.2s;
        }

        .game-overlay button:active {
            transform: scale(0.95);
        }

        .start-hint {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-top: 1rem;
        }
    </style>
  <script src="../js/core/music.js" defer></script>
  <script src="../js/core/navigation.js" defer></script>
</head>

<body class="game-page">
    <div class="game-header">
        <a href="../games.html"><i class="fas fa-arrow-left"></i> Orqaga</a>
        <span id="score-display">0</span>
        <div id="xp-display"></div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div class="game-overlay" id="start-screen">
        <h2>🐦 Flappy Jump</h2>
        <p style="color: rgba(255,255,255,0.7); margin-bottom: 1rem; max-width: 280px;">Ekranni bosib qulingizni
            sakrating. Quvurlardan o'ting!</p>
        <button onclick="startGame()"><i class="fas fa-play"></i> Boshlash</button>
        <p class="start-hint">Tap / Click to jump</p>
    </div>

    <div class="game-overlay" id="gameover-screen" style="display: none;">
        <h2>Game Over</h2>
        <div class="score-big" id="final-score">0</div>
        <div class="highscore" id="highscore-text">Eng yuqori: 0</div>
        <button onclick="startGame()"><i class="fas fa-redo"></i> Qayta o'ynash</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        let bird, pipes, score, highScore, gameRunning, gameStarted, frameCount;
        let gravity = 0.35;
        let jumpForce = -6.5;
        let pipeGap = 150;
        let pipeWidth = 52;
        let pipeSpeed = 2.5;
        let pipeInterval = 100;

        highScore = parseInt(localStorage.getItem('zeta_flappy_highscore') || '0');

        function resize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            W = canvas.width = canvas.offsetWidth;
            H = canvas.height = canvas.offsetHeight;

            // Adjust physics for screen size
            if (H < 500) {
                pipeGap = 120;
                gravity = 0.3;
                jumpForce = -5.5;
            } else if (H < 700) {
                pipeGap = 140;
                gravity = 0.33;
                jumpForce = -6;
            } else {
                pipeGap = 155;
            }
        }

        function initBird() {
            return {
                x: W * 0.2,
                y: H / 2,
                w: 28,
                h: 22,
                vy: 0,
                angle: 0
            };
        }

        function createPipe() {
            const minTop = 60;
            const maxTop = H - pipeGap - 60;
            const topH = minTop + Math.random() * (maxTop - minTop);
            return {
                x: W + 10,
                topH: topH,
                scored: false
            };
        }

        function init() {
            resize();
            bird = initBird();
            pipes = [];
            score = 0;
            frameCount = 0;
            gameRunning = false;
            gameStarted = false;
            updateScoreDisplay();
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            resize();
            bird = initBird();
            pipes = [];
            score = 0;
            frameCount = 0;
            gameRunning = true;
            gameStarted = true;
            pipeSpeed = 2.5;
            updateScoreDisplay();
            loop();
        }

        function jump() {
            if (!gameRunning) return;
            bird.vy = jumpForce;
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').textContent = score;
        }

        function gameOver() {
            gameRunning = false;
            let isNewHigh = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('zeta_flappy_highscore', highScore.toString());
                isNewHigh = true;
            }

            // Award XP
            const xpEarned = Math.floor(score / 10) * 5;
            if (xpEarned > 0 && typeof addXP === 'function') {
                addXP(xpEarned);
            }
            if (isNewHigh && score > 0 && typeof addXP === 'function') {
                addXP(50);
            }

            document.getElementById('final-score').textContent = score;
            document.getElementById('highscore-text').textContent =
                `${isNewHigh ? '🏆 Yangi rekord! ' : ''}Eng yuqori: ${highScore}`;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function update() {
            // Bird physics
            bird.vy += gravity;
            bird.y += bird.vy;
            bird.angle = Math.min(Math.max(bird.vy * 3, -30), 70);

            // Ceiling & Floor
            if (bird.y < 0) {
                bird.y = 0;
                bird.vy = 0;
            }
            if (bird.y + bird.h > H) {
                gameOver();
                return;
            }

            // Pipes
            frameCount++;
            if (frameCount % pipeInterval === 0) {
                pipes.push(createPipe());
                // Increase difficulty
                if (pipeSpeed < 4.5) pipeSpeed += 0.05;
                if (pipeInterval > 70) pipeInterval -= 1;
                if (pipeGap > 110) pipeGap -= 0.5;
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.x -= pipeSpeed;

                // Remove off-screen
                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                    continue;
                }

                // Score
                if (!p.scored && p.x + pipeWidth < bird.x) {
                    p.scored = true;
                    score++;
                    updateScoreDisplay();
                }

                // Collision
                if (
                    bird.x + bird.w > p.x &&
                    bird.x < p.x + pipeWidth
                ) {
                    if (bird.y < p.topH || bird.y + bird.h > p.topH + pipeGap) {
                        gameOver();
                        return;
                    }
                }
            }
        }

        function draw() {
            // Background gradient
            const bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, '#0a0a2e');
            bg.addColorStop(0.5, '#1a1a4e');
            bg.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // Stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 30; i++) {
                const sx = (i * 137.5 + frameCount * 0.1) % W;
                const sy = (i * 73.2) % H;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }

            // Pipes (neon glow)
            pipes.forEach(p => {
                // Neon green pipes
                const pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
                pipeGrad.addColorStop(0, '#059669');
                pipeGrad.addColorStop(0.5, '#10b981');
                pipeGrad.addColorStop(1, '#059669');

                // Top pipe
                ctx.fillStyle = pipeGrad;
                ctx.fillRect(p.x, 0, pipeWidth, p.topH);
                // Top pipe cap
                ctx.fillStyle = '#10b981';
                ctx.fillRect(p.x - 3, p.topH - 16, pipeWidth + 6, 16);

                // Bottom pipe
                const bottomY = p.topH + pipeGap;
                ctx.fillStyle = pipeGrad;
                ctx.fillRect(p.x, bottomY, pipeWidth, H - bottomY);
                // Bottom pipe cap
                ctx.fillStyle = '#10b981';
                ctx.fillRect(p.x - 3, bottomY, pipeWidth + 6, 16);

                // Glow effect
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = 8;
                ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
                ctx.fillRect(p.x - 5, 0, pipeWidth + 10, p.topH);
                ctx.fillRect(p.x - 5, bottomY, pipeWidth + 10, H - bottomY);
                ctx.shadowBlur = 0;
            });

            // Bird
            ctx.save();
            ctx.translate(bird.x + bird.w / 2, bird.y + bird.h / 2);
            ctx.rotate(bird.angle * Math.PI / 180);

            // Bird body (neon style)
            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.w / 2, bird.h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(6, -3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(7, -3, 2, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(bird.w / 2, -2);
            ctx.lineTo(bird.w / 2 + 8, 1);
            ctx.lineTo(bird.w / 2, 4);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Score (in-game)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.font = 'bold 2rem Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(score, W / 2, 60);
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Input
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!gameStarted) startGame();
                else jump();
            }
        });

        window.addEventListener('resize', () => {
            if (gameStarted) resize();
        });

        // Init
        init();
        // Draw idle screen
        resize();
        draw();
    </script>
</body>

</html>
