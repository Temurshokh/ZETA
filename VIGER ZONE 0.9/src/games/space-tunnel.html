<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Space Tunnel | ZETA</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/xp.js" defer></script>
  <script src="../js/main.js" defer></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      z-index: 10;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .btn-ui {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    #countdown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20;
      transition: opacity 0.3s ease;
    }

    #countdown-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #countdown-text {
      font-size: 5rem;
      font-weight: bold;
      color: #00ff00;
      text-shadow: 0 0 40px #00ff00;
      animation: pulse 0.5s ease-in-out infinite alternate;
    }

    #countdown-label {
      font-size: 1.5rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 1rem;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.15);
      }
    }

    #shield-indicator {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 30px;
      background: rgba(0, 255, 0, 0.3);
      border: 2px solid #00ff00;
      border-radius: 25px;
      color: #00ff00;
      font-size: 1rem;
      font-weight: bold;
      z-index: 15;
      display: none;
    }

    #shield-indicator.active {
      display: block;
      animation: shieldGlow 0.5s ease-in-out infinite alternate;
    }

    @keyframes shieldGlow {
      from {
        box-shadow: 0 0 10px #00ff00, 0 0 20px rgba(0, 255, 0, 0.5);
      }

      to {
        box-shadow: 0 0 25px #00ff00, 0 0 40px rgba(0, 255, 0, 0.7);
      }
    }

    #shield-timer {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
      z-index: 15;
      display: none;
    }

    #shield-timer.active {
      display: block;
    }

    #shield-timer-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff00, #00ffff);
      width: 100%;
      transition: width 0.1s linear;
    }

    .control-hint {
      position: absolute;
      bottom: 100px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      z-index: 10;
      pointer-events: none;
    }
  </style>
  <script src="../js/core/music.js" defer></script>
  <script src="../js/core/navigation.js" defer></script>
</head>

<body class="game-page">
  <div id="hud">
    <a href="../games.html" class="btn-ui"><i class="fas fa-arrow-left"></i> Chiqish</a>
    <div class="btn-ui">Score: <span id="score">0</span></div>
  </div>

  <div id="countdown-overlay">
    <div id="countdown-label">Get Ready...</div>
    <div id="countdown-text">3</div>
  </div>

  <div id="shield-indicator">🛡️ Shield Active</div>
  <div id="shield-timer" class="active">
    <div id="shield-timer-fill"></div>
  </div>

  <div class="control-hint">
    Sichqoncha yoki barmog'ingiz bilan boshqaring
  </div>

  <div id="game-container"></div>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    // Scene
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 10, 50);

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      100,
    );
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById("game-container").appendChild(renderer.domElement);

    // Tunnel
    const tunnelRadius = 5;
    const tunnelLength = 100;
    const segments = 50;
    const tunnelGeo = new THREE.CylinderGeometry(
      tunnelRadius,
      tunnelRadius,
      tunnelLength,
      16,
      segments,
      true,
    );
    tunnelGeo.rotateX(Math.PI / 2);

    const tunnelMat = new THREE.MeshBasicMaterial({
      color: 0x00ff00,
      wireframe: true,
      transparent: true,
      opacity: 0.3,
    });
    const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
    scene.add(tunnel);

    // Player Ship
    const shipGeo = new THREE.ConeGeometry(0.5, 1.5, 8);
    shipGeo.rotateX(Math.PI / 2);
    const shipMat = new THREE.MeshNormalMaterial();
    const ship = new THREE.Mesh(shipGeo, shipMat);
    scene.add(ship);

    // Obstacles pool - START FAR AWAY (2+ seconds of travel time)
    const obstacles = [];
    const obstaclePool = [];
    const OBSTACLE_COUNT = 20;
    const SAFE_ZONE_DISTANCE = -80; // Obstacles start very far away

    function createObstacle() {
      const obs = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true }),
      );
      return obs;
    }

    // Pre-create obstacles but position them far away
    for (let i = 0; i < OBSTACLE_COUNT; i++) {
      const obs = createObstacle();
      resetObstacle(obs, true); // Initial spawn - very far
      scene.add(obs);
      obstacles.push(obs);
    }

    function resetObstacle(obs, initialSpawn = false) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * (tunnelRadius - 1.2);
      obs.position.x = Math.cos(angle) * r;
      obs.position.y = Math.sin(angle) * r;

      // Initial spawn: much farther away for 2+ second safety window
      // Regular reset: normal distance
      const baseDistance = initialSpawn ? SAFE_ZONE_DISTANCE : -60;
      obs.position.z = baseDistance - Math.random() * 40;

      obs.rotation.x = Math.random() * Math.PI;
      obs.rotation.y = Math.random() * Math.PI;
    }

    // Input data
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;

    document.addEventListener("mousemove", (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    document.addEventListener("touchmove", (e) => {
      e.preventDefault();
      mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
    }, { passive: false });

    // Touch start for initial position
    document.addEventListener("touchstart", (e) => {
      mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
    }, { passive: true });

    // Game state
    let speed = 0.5;
    let score = 0;
    let gameOver = false;
    let gameStarted = false;
    let startTime = 0;
    const SHIELD_DURATION = 2000; // 2 seconds invincibility

    // UI Elements
    const shieldIndicator = document.getElementById("shield-indicator");
    const shieldTimer = document.getElementById("shield-timer");
    const shieldTimerFill = document.getElementById("shield-timer-fill");

    // Countdown logic
    async function startCountdown() {
      const overlay = document.getElementById("countdown-overlay");
      const countdownText = document.getElementById("countdown-text");
      const countdownLabel = document.getElementById("countdown-label");

      overlay.classList.remove("hidden");
      countdownLabel.textContent = "Get Ready...";

      // Reset game state
      speed = 0.5;
      score = 0;
      document.getElementById("score").innerText = 0;
      ship.position.set(0, 0, 0);
      targetX = 0;
      targetY = 0;

      // Reset all obstacles to far positions
      obstacles.forEach(obs => resetObstacle(obs, true));

      // Countdown 3-2-1
      for (let i = 3; i >= 1; i--) {
        countdownText.textContent = i;
        await new Promise(resolve => setTimeout(resolve, 700));
      }

      countdownText.textContent = "GO!";
      countdownText.style.color = "#00ffff";
      await new Promise(resolve => setTimeout(resolve, 400));

      overlay.classList.add("hidden");
      countdownText.style.color = "#00ff00";

      // Start game with shield
      gameOver = false;
      gameStarted = true;
      startTime = Date.now();

      // Show shield UI
      shieldIndicator.classList.add("active");
      shieldTimer.classList.add("active");
      shieldTimerFill.style.width = "100%";

      animate();
    }

    function isShieldActive() {
      return Date.now() - startTime < SHIELD_DURATION;
    }

    function updateShieldUI() {
      if (!gameStarted) return;

      const elapsed = Date.now() - startTime;
      const remaining = Math.max(0, SHIELD_DURATION - elapsed);
      const percent = (remaining / SHIELD_DURATION) * 100;

      shieldTimerFill.style.width = percent + "%";

      if (remaining <= 0) {
        shieldIndicator.classList.remove("active");
        shieldTimer.classList.remove("active");
      }
    }

    function animate() {
      if (gameOver) return;
      requestAnimationFrame(animate);

      updateShieldUI();

      // Move Player smoothly
      targetX = mouseX * (tunnelRadius - 1);
      targetY = mouseY * (tunnelRadius - 1);

      ship.position.x += (targetX - ship.position.x) * 0.12;
      ship.position.y += (targetY - ship.position.y) * 0.12;

      // Keep ship inside tunnel
      const distFromCenter = Math.sqrt(ship.position.x ** 2 + ship.position.y ** 2);
      if (distFromCenter > tunnelRadius - 1) {
        const angle = Math.atan2(ship.position.y, ship.position.x);
        ship.position.x = Math.cos(angle) * (tunnelRadius - 1);
        ship.position.y = Math.sin(angle) * (tunnelRadius - 1);
      }

      // Bank ship rotation
      ship.rotation.z = -ship.position.x * 0.3;

      // Move Obstacles
      obstacles.forEach((obs) => {
        obs.position.z += speed;
        obs.rotation.x += 0.03;
        obs.rotation.y += 0.03;

        // Pass player?
        if (obs.position.z > camera.position.z) {
          resetObstacle(obs);
          score++;
          document.getElementById("score").innerText = score;
          speed += 0.001;
        }

        // Collision check - only after shield expires
        if (!isShieldActive()) {
          const dx = obs.position.x - ship.position.x;
          const dy = obs.position.y - ship.position.y;
          const dz = obs.position.z - ship.position.z;
          const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

          if (distance < 1.0) {
            gameOver = true;
            gameStarted = false;

            if (window.addXP) addXP(Math.floor(score / 5));

            // Use GameUI if available
            if (window.GameUI) {
              window.GameUI.showGameOver(score, startCountdown);
            } else {
              setTimeout(() => {
                alert("CRASH! Score: " + score);
                startCountdown();
              }, 100);
            }
          }
        }
      });

      // Rotate Tunnel
      tunnel.rotation.z += 0.002;

      renderer.render(scene, camera);
    }

    // Start the countdown
    startCountdown();

    // Resize handler
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
