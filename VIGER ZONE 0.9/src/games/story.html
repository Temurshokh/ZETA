<head>

  <style>
    body {
      background: #0f0f13;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    .story-card {
      background: rgba(30, 30, 40, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      /* Reduced padding from 24px */
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }

    .story-image {
      width: 100%;
      height: 160px;
      /* Reduced height from 200px */
      background-color: #333;
      background-image: linear-gradient(to bottom, #2c3e50, #000);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .story-image::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
    }

    .scene-title {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(45deg, #10b981, #00ffcc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }

    .story-text {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #fff;
      text-shadow: 0 1px 2px black;
      min-height: 80px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInText 0.5s forwards;
    }

    @keyframes fadeInText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .choices-grid {
      display: grid;
      gap: 12px;
      margin-top: 1.5rem;
    }

    .choice-btn {
      text-align: left;
      padding: 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      transition: all 0.2s;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateX(-10px);
      animation: slideInChoice 0.4s forwards;
    }

    .choice-btn:nth-child(1) {
      animation-delay: 0.1s;
    }

    .choice-btn:nth-child(2) {
      animation-delay: 0.2s;
    }

    .choice-btn:nth-child(3) {
      animation-delay: 0.3s;
    }

    .choice-btn:nth-child(4) {
      animation-delay: 0.4s;
    }

    @keyframes slideInChoice {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .choice-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #10b981;
      transform: translateX(5px);
    }

    .choice-btn:active {
      transform: scale(0.98);
    }

    .choice-btn i {
      color: #10b981;
      font-size: 1.1rem;
    }

    .badge-container {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
    }

    .badge.win {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    .badge.danger {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #00ffcc);
      transition: width 0.5s ease;
    }

    .game-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 19, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
    }
  </style>

</head>

        text: "Ehtiyotkorlik bilan porloq narsani oldingiz — bu qadimiy oltin medal ekan! Ayiq uyg'onmadi. Siz tezda chiqib ketdingiz va ertalab shaharga yetib oldingiz. Muzeydagi mutaxassislar bu medalning millionlab dollar turarkligini aytishdi!",
        img: "https://images.unsplash.com/photo-1543536448-d209d2d13a1c?w=600&q=80",
        type: "🏆 Katta G'alaba",
        typeClass: "win",
        chapter: "Yakuniy",
        progress: 100,
        choices: [{ text: "🎉 Qayta o'ynash", icon: "fa-redo", next: 0 }],
        win: true,
        xp: 100
      },
      23: {
        title: "Qorong'u Sir",
        text: "Uyni tekshirsangiz, yerto'la eshigini topdingiz. Lekin qandaydir qorong'u kuch sizni tortib ketdi... Siz endi o'sha uyning qurbonlari qatoriga qo'shildingiz.",
        img: "https://images.unsplash.com/photo-1509248961189-91c797d09e94?w=600&q=80",
        type: "💀 Qorong'u Yakun",
        typeClass: "danger",
        chapter: "Yakuniy",
        progress: 100,
        choices: [{ text: "Qayta urinib ko'rish", icon: "fa-undo", next: 0 }],
      }
    };

    let visitedNodes = new Set();

    function makeChoice(nodeId) {
      const data = storyNodes[nodeId];
      if (!data) return;

      // Track visited nodes
      visitedNodes.add(nodeId);

      // Update progress bar
      const progressBar = document.getElementById('story-progress');
      if (progressBar) {
        progressBar.style.width = data.progress + '%';
      }

      // Update UI with animation
      const titleEl = document.getElementById("story-title");
      const textEl = document.getElementById("story-text");
      const imgEl = document.getElementById("story-img");

      // Reset animation
      textEl.style.animation = 'none';
      textEl.offsetHeight; // Trigger reflow
      textEl.style.animation = 'fadeInText 0.5s forwards';

      titleEl.innerText = data.title;
      textEl.innerText = data.text;
      imgEl.style.backgroundImage = `url('${data.img}')`;

      // Update badges
      const typeBadge = document.getElementById("scene-type");
      typeBadge.innerText = data.type || "Sarguzasht";
      typeBadge.className = 'badge' + (data.typeClass ? ' ' + data.typeClass : '');

      const chapterBadge = document.getElementById("scene-chapter");
      chapterBadge.innerText = typeof data.chapter === 'number' ? `Qism ${data.chapter}` : data.chapter;

      // Render choices with animation
      const btnContainer = document.getElementById("choices");
      btnContainer.innerHTML = "";

      data.choices.forEach((choice, index) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerHTML = `<i class="fas ${choice.icon || 'fa-arrow-right'}"></i> ${choice.text}`;
        btn.style.animationDelay = `${index * 0.1}s`;
        btn.onclick = () => {
          if (navigator.vibrate) navigator.vibrate(10);
          makeChoice(choice.next);
        };
        btnContainer.appendChild(btn);
      });

      // Award XP for winning
      if (data.win) {
        const reward = data.xp || 20;
        if (window.addXP) addXP(reward);

        // Reset visited nodes on win
        visitedNodes.clear();
      }
    }

    // Initialize
    makeChoice(0);
  </script>
